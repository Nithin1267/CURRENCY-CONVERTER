<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RupeeX - Currency Converter</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- India Stripe -->
    <div class="india-stripe"></div>

    <!-- Background Orbs -->
    <div class="bg-orbs">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <!-- Money Animation Canvas -->
    <canvas id="moneyCanvas"></canvas>

    <!-- Floating Symbols -->
    <div class="float-symbols" id="floatSymbols"></div>

    <div class="app">

        <!-- Header -->
        <header class="site-header">

            <div class="brand">
                <div class="brand-icon">₹</div>
                <div class="brand-name">RupeeX</div>
            </div>

            <div class="brand-sub">
                Smart Currency Converter
            </div>

            <div class="made-tag">
                🇮🇳 Made in India · Developed by Nithin Kumar
            </div>

            <div style="margin-top:8px;">
                <label for="themeSelect" class="field-label" style="display:inline-block;margin-right:8px;">Theme</label>
                <select id="themeSelect" class="currency-select" style="width:140px;padding:6px 10px;">
                    <option value="light">Light</option>
                    <option value="ocean">Ocean</option>
                    <option value="pastel">Pastel</option>
                    <option value="dark">Dark</option>
                </select>
            </div>

        </header>

        <!-- Main Card -->
        <div class="card">

            <!-- Tabs -->
            <div class="tabs">

                <button class="tab-btn active" data-tab="convert">
                    Convert
                </button>

                <button class="tab-btn" data-tab="multi">
                    Multi
                </button>

                <button class="tab-btn" data-tab="history">
                    History
                </button>

            </div>

            <!-- Convert Panel -->
            <div class="panel active" id="panel-convert">

                <div class="field-label">
                    Amount & From Currency
                </div>

                <div class="input-row">
                    <input
                        type="number"
                        id="amountInput"
                        class="amount-input"
                        value="1"
                        min="0"
                        placeholder="0.00"
                    >

                    <select
                        id="fromSelect"
                        class="currency-select">
                    </select>
                </div>

                <!-- Swap -->
                <div class="swap-row">

                    <div class="swap-line"></div>

                    <button
                        id="swapBtn"
                        class="swap-btn"
                        title="Swap Currency">
                        ⇅
                    </button>

                    <div class="swap-line"></div>

                </div>

                <!-- To Currency -->
                <div class="field-label">
                    To Currency
                </div>

                <div class="input-row">
                    <select
                        id="toSelect"
                        class="currency-select full">
                    </select>
                </div>

                <!-- Convert Button -->
                <button
                    id="convertBtn"
                    class="convert-btn">
                    Convert →
                </button>

                <!-- Error -->
                <div
                    id="errorBox"
                    class="error-box">
                </div>

                <!-- Result -->
                <div
                    id="resultBox"
                    class="result-box">

                    <div class="result-top">

                        <div>

                            <div class="result-label">
                                Converted Amount
                            </div>

                            <div
                                id="resultAmount"
                                class="result-amount">
                            </div>

                        </div>

                        <button
                            id="copyBtn"
                            class="copy-btn">
                            📋 Copy
                        </button>

                    </div>

                    <div
                        id="resultMeta"
                        class="result-meta">
                    </div>

                </div>

                <!-- India Pairs -->
                <div class="section-divider">

                    <div class="section-title">
                        🇮🇳 India Quick Pairs
                    </div>

                    <div
                        id="indiaChips"
                        class="chips">
                    </div>

                </div>

                <!-- Global Pairs -->
                <div class="section-divider">

                    <div class="section-title">
                        🌍 Global Pairs
                    </div>

                    <div
                        id="globalChips"
                        class="chips">
                    </div>

                </div>

            </div>

            <!-- Multi Convert -->
            <div class="panel" id="panel-multi">

                <div class="field-label">
                    Base Amount
                </div>

                <div class="input-row">

                    <input
                        type="number"
                        id="multiAmount"
                        class="amount-input"
                        value="1"
                        min="0"
                    >

                    <select
                        id="multiFrom"
                        class="currency-select">
                    </select>

                </div>

                <button
                    id="multiBtn"
                    class="convert-btn">
                    Convert to All →
                </button>

                <div class="section-divider">

                    <div class="section-title">
                        Results
                    </div>

                    <div
                        id="multiGrid"
                        class="multi-grid">
                    </div>

                </div>

            </div>

            <!-- History -->
            <div class="panel" id="panel-history">

                <div class="history-header">

                    <div class="section-title">
                        Recent Conversions
                    </div>

                    <button
                        id="clearHistoryBtn"
                        class="copy-btn">
                        🗑 Clear
                    </button>

                </div>

                <div
                    id="historyList"
                    class="history-list">
                </div>

            </div>

        </div>

        <!-- Footer -->
        <footer class="footer">
            RupeeX · Developed by
            <strong>Nithin Kumar</strong>
            · Live Exchange Rates
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
